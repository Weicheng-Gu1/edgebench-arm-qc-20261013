name: Edgebench defect-chain encrypted native ARM validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare ephemeral native runner
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography
          df -B1 .
      - name: Verify encrypted transport and unpack private fixtures
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/defect-chain-frozen-v1-20261013/defect-payload.aesgcm'
          echo 'f3d408103aaccaeb427d4e6c031253c0f6b7e3667973a09f50e3883ba6c02931  payload.aesgcm' | sha256sum --check -
          python3 crypto_transport.py decrypt payload.aesgcm decoded
          chmod 700 decoded
      - name: Actual native dual build and original Oracle NOP partial controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo -n python3 decoded/payload/scripts/run_arm_glass_qc.py --payload-root "$PWD/decoded/payload" --output "$PWD/evidence/native" > evidence/controller.log 2>&1
      - name: Encrypt all detailed validation evidence
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" python3 crypto_transport.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-defect-native-arm-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
