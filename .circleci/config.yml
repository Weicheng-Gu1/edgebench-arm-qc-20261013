version: 2.1
jobs:
  slideshow-native-arm-c4:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Frozen Slideshow source native ARM two-role dual-entry controls
          no_output_timeout: 130m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            timeout 7500 python3 ci/slideshow-arm-outer-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: slideshow-native-arm-c4
workflows:
  slideshow-native-arm-c4:
    jobs:
      - slideshow-native-arm-c4
