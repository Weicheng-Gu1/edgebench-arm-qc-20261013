version: 2.1
jobs:
  esa-bounded-physics-native:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: ESA bounded physics missing-only native source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_ESA_BOUNDED_PHYSICS_CIRCLE_R1_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/esa-bounded-physics-r1/circle_worker.py --lane native --work /tmp/esa-bounded-physics-native-work --output /tmp/esa-bounded-physics-native-public
      - store_artifacts:
          path: /tmp/esa-bounded-physics-native-public
          destination: esa-bounded-physics-r1/native
  esa-bounded-physics-multi-agent:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: ESA bounded physics missing-only multi-agent source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_ESA_BOUNDED_PHYSICS_CIRCLE_R1_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/esa-bounded-physics-r1/circle_worker.py --lane multi-agent --work /tmp/esa-bounded-physics-multi-agent-work --output /tmp/esa-bounded-physics-multi-agent-public
      - store_artifacts:
          path: /tmp/esa-bounded-physics-multi-agent-public
          destination: esa-bounded-physics-r1/multi-agent
  esa-bounded-physics-multi-verifier:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: ESA bounded physics missing-only multi-verifier source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_ESA_BOUNDED_PHYSICS_CIRCLE_R1_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/esa-bounded-physics-r1/circle_worker.py --lane multi-verifier --work /tmp/esa-bounded-physics-multi-verifier-work --output /tmp/esa-bounded-physics-multi-verifier-public
      - store_artifacts:
          path: /tmp/esa-bounded-physics-multi-verifier-public
          destination: esa-bounded-physics-r1/multi-verifier
workflows:
  esa-bounded-physics-source-native-and-singlemulti:
    jobs:
      - esa-bounded-physics-native:
          filters:
            branches:
              only: edgebench-esa-bounded-physics-source-native-multi-20261015-r1
      - esa-bounded-physics-multi-agent:
          filters:
            branches:
              only: edgebench-esa-bounded-physics-source-native-multi-20261015-r1
      - esa-bounded-physics-multi-verifier:
          filters:
            branches:
              only: edgebench-esa-bounded-physics-source-native-multi-20261015-r1
