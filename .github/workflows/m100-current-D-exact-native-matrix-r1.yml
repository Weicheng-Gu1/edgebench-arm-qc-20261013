name: M100 current D exact public roles native AMD64 ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-current-deployment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install only SHA locked public controller dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          curl --fail --location --retry 3 --output public-host-dependencies.zip 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-public-native-matrix-r1-20261015-static5-r1-20261014/public-host-dependencies.zip'
          echo '6c528f1986901036258a0d07004537c9c2c8bf7357c16ba0af3a3cb2c5a122a9  public-host-dependencies.zip' | sha256sum --check -
          mkdir -p public-host-dependencies
          unzip -q public-host-dependencies.zip -d public-host-dependencies
          /usr/bin/python3 -m pip install --no-index --find-links public-host-dependencies/common --find-links public-host-dependencies/${{ matrix.arch }} --require-hashes --target /tmp/m100-current-D-exact-deps -r public-host-dependencies/requirements-${{ matrix.arch }}.txt
      - name: Authenticate encrypted exact task and fixed reference
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_CURRENT_D_EXACT_R1_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-current-D-exact-native-matrix-r1-20261015/m100-current-D-exact-native-matrix-r1-20261015-payload.aesgcm'
          echo '8d1c652e88f944441e3dcc6c7d2919ac75477f758d818a964a58fea8a5a7a122  payload.aesgcm' | sha256sum --check -
          PYTHONPATH=/tmp/m100-current-D-exact-deps /usr/bin/python3 crypto_m100_current_D_exact_r1.py decrypt payload.aesgcm decoded
          chmod 700 decoded
          echo '8ad9e574e8dcd8e91e07582a891776e0f595de346dc4c07a0aada3c32210d9fb  decoded/payload/RAW-MANIFEST.json' | sha256sum --check -
          /usr/bin/python3 -B decoded/payload/scripts/verify_payload.py decoded/payload evidence/payload-identity.json
      - name: Build exact sibling roles and one original native reference
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo -n env DOCKER_BUILDKIT=0 PYTHONPATH=/tmp/m100-current-D-exact-deps PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B decoded/payload/scripts/run_exact_deployment_qc.py --payload decoded/payload --platform linux/${{ matrix.arch }} --output evidence/exact --execute > evidence/controller.log 2>&1
      - name: Encrypt raw evidence including failures
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_CURRENT_D_EXACT_R1_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" PYTHONPATH=/tmp/m100-current-D-exact-deps /usr/bin/python3 crypto_m100_current_D_exact_r1.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted architecture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-m100-current-D-exact-r1-${{ matrix.arch }}-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
