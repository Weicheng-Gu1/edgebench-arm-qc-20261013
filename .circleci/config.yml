version: 2.1
parameters:
  run_sealed_formal:
    type: boolean
    default: false
jobs:
  sealed-thorp-proper-roles-native-arm-build:
    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Public transport dependency
          command: |
            set +x
            sudo apt-get update >/tmp/eb-transport-install.log 2>&1
            sudo apt-get install -y python3-cryptography >>/tmp/eb-transport-install.log 2>&1
            /usr/bin/python3 -c 'import json, sys, cryptography; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; from cryptography.hazmat.primitives.asymmetric import padding; assert callable(AESGCM.generate_key) and callable(padding.OAEP); print(json.dumps({"python_executable": sys.executable, "python_version": sys.version.split()[0], "cryptography_version": cryptography.__version__, "AESGCM_and_OAEP_import_verified": True}))'
      - run:
          name: One original sealed two-role build-only, CircleCI background step
          background: true
          command: |
            set +x
            /usr/bin/python3 -u ci/run_sealed_control.py
      - run:
          name: Bounded original-control observation 1 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-1
      - run:
          name: Bounded original-control observation 2 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-2
      - run:
          name: Bounded original-control observation 3 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-3
      - run:
          name: Bounded original-control observation 4 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-4
      - run:
          name: Bounded original-control observation 5 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-5
      - run:
          name: Bounded original-control observation 6 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-6
      - run:
          name: Bounded original-control observation 7 of 7
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480 --final-preservation-step
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/checkpoint-7
      - run:
          name: Require both role builds and native probes; no math grade
          command: /usr/bin/python3 ci/require_original_full_result.py
      - store_artifacts:
          path: sealed-artifacts
          destination: sealed-native-control/final
workflows:
  sealed-thorp-proper-roles-native-arm-build-once:
    when: << pipeline.parameters.run_sealed_formal >>
    jobs:
      - sealed-thorp-proper-roles-native-arm-build:
          context: edgebench-one-use-thorp-proper-role-build-20261015T162336Z
          filters:
            branches:
              only: /^edgebench-sealed-thorp-proper-role-build-.+$/
