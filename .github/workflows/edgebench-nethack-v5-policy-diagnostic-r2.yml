name: Edgebench NetHack V5 same observation policy diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare ephemeral native runner
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography
          df -B1 .
      - name: Verify encrypted transport and unpack private fixtures
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/nethack-frozen-v5-native-arm-20261013/nethack-v5-payload.aesgcm'
          echo '9591c6843923b360c706e6c8340c0479c118622f229dd304e22f85377da4ee02  payload.aesgcm' | sha256sum --check -
          python3 crypto_transport.py decrypt payload.aesgcm decoded
          chmod 700 decoded
          curl --fail --location --retry 3 --output fixture.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/nethack-v5-policy-sameobs-r2-20261013/same-observations.aesgcm'
          echo '3bfb765aa6b965557a91fd1a0fc23bed5d88f3688f21a2fc9d1ec8f8bd7a1c29  fixture.aesgcm' | sha256sum --check -
          python3 crypto_transport.py decrypt fixture.aesgcm fixture
          chmod 700 fixture
      - name: Actual native dual build and original Oracle NOP partial controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp diagnostics/nethack-v5-policy-r2/run_probe.py decoded/payload/scripts/run_policy_probe.py
          sudo -n python3 decoded/payload/scripts/run_policy_probe.py --payload-root "$PWD/decoded/payload" --output "$PWD/evidence/native" --script "$PWD/diagnostics/nethack-v5-policy-r2/policy_probe_r2.py" --fixture "$PWD/fixture/payload/same-observations.json" > evidence/controller.log 2>&1
      - name: Encrypt all detailed validation evidence
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" python3 crypto_transport.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-nethack-v5-policy-diagnostic-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
