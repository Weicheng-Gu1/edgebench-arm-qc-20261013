version: 2.1
jobs:
  painting-full-receiver-arm64-r4:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Painting same payload ARM-only registry transport retry
          no_output_timeout: 185m
          command: sudo --preserve-env=EDGEBENCH_PAINTING_FULL_RECEIVER_R4_ARM_ONLY_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/painting-full-receiver-r4-arm-only/circle_worker.py --lane native-arm64 --work /tmp/painting-full-arm64-work --output /tmp/painting-full-arm64-public
      - store_artifacts:
          path: /tmp/painting-full-arm64-public
          destination: painting-full-receiver-r4-arm-only/native-arm64
workflows:
  painting-full-receiver-r4-arm-only:
    jobs:
      - painting-full-receiver-arm64-r4:
          filters:
            branches:
              only: edgebench-painting-full-receiver-r4-arm-only-20261015
