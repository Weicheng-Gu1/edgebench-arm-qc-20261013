name: M100 public minimal r2 native ARM deployment validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install only pinned public host wheels
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = aarch64
          /usr/bin/python3 --version
          /usr/bin/python3 -m pip --version
          curl --fail --location --retry 3 --output public-host-dependencies.zip 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-static-public-minimal-r2-20261015-static5-r1-20261014/public-host-dependencies.zip'
          echo '890d6e8b8e7a4fd1e636c0dbad4f2004a9585d4fe1c04b2aac3b2fd4584ca831  public-host-dependencies.zip' | sha256sum --check -
          mkdir -p public-host-dependencies
          unzip -q public-host-dependencies.zip -d public-host-dependencies
          /usr/bin/python3 -m pip install --no-index --find-links public-host-dependencies --require-hashes --target /tmp/m100-public-host-deps -r public-host-dependencies/requirements.txt
          df -B1 .
      - name: Authenticate encrypted private task and control transport
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_PUBLIC_MINIMAL_R2_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-static-public-minimal-r2-20261015-static5-r1-20261014/m100-static-public-minimal-r2-20261015-payload.aesgcm'
          echo 'aee775d321ca4c0fe8e781b89f006902da4482414b80987fc3380618e8ef2003  payload.aesgcm' | sha256sum --check -
          PYTHONPATH=/tmp/m100-public-host-deps /usr/bin/python3 crypto_m100_public_minimal_r2.py decrypt payload.aesgcm decoded
          chmod 700 decoded
      - name: Public two-role build and 23 original static-plan controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo -n env DOCKER_BUILDKIT=0 PYTHONPATH=/tmp/m100-public-host-deps PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 decoded/payload/scripts/run_public_roles_qc.py --platform linux/arm64 --package decoded/payload/package --fixtures decoded/payload/private-fixtures --output evidence/native --reference-repetitions 5 --execute > evidence/controller.log 2>&1
      - name: Encrypt detailed evidence including failures
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_PUBLIC_MINIMAL_R2_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" PYTHONPATH=/tmp/m100-public-host-deps /usr/bin/python3 crypto_m100_public_minimal_r2.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-m100-public-minimal-r2-native-arm-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
