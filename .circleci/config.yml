version: 2.1
jobs:
  native-mpfr-v002-task-qc:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Source-built frozen MPFR task on native ARM64
          no_output_timeout: 45m
          command: timeout --signal=KILL 100m python3 .circleci/swe_mpfr_v002_native_arm_qc.py
      - store_artifacts:
          path: /tmp/swe-mpfr-v002-native-arm-public-r1
          destination: swe-MPFR-native-arm-qc
workflows:
  swe-MPFR-native-arm-qc-r1:
    jobs:
      - native-mpfr-v002-task-qc:
          filters:
            branches:
              only: swe-mpfr-v002-native-arm-qc-20261015-r1
