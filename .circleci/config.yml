    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Public transport dependency
          command: |
            set +x
            sudo apt-get update >/tmp/eb-transport-install.log 2>&1
            sudo apt-get install -y python3-cryptography >>/tmp/eb-transport-install.log 2>&1
            /usr/bin/python3 -c 'import json, sys, cryptography; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; from cryptography.hazmat.primitives.asymmetric import padding; assert callable(AESGCM.generate_key) and callable(padding.OAEP); print(json.dumps({"python_executable": sys.executable, "python_version": sys.version.split()[0], "cryptography_version": cryptography.__version__, "AESGCM_and_OAEP_import_verified": True}))'
      - run:
          name: One original sealed two roles and one fixed Oracle, CircleCI background step
          background: true
          command: |
            set +x
            /usr/bin/python3 -u ci/run_sealed_control.py
      - run:
          name: Bounded original-control observation 1 of 29
          no_output_timeout: 12m
          command: /usr/bin/python3 ci/watch_existing_control_bounded.py --seconds 480
      - store_artifacts:
          path: sealed-artifacts
