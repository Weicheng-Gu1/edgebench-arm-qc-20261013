version: 2.1
jobs:
  drone-native-arm-c1:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Frozen Drone source native ARM two-role dual-entry controls
          no_output_timeout: 130m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            timeout 7500 python3 ci/drone-arm-outer-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: drone-native-arm-c1
workflows:
  drone-native-arm-c1:
    jobs:
      - drone-native-arm-c1
