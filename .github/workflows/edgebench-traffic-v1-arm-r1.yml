name: Edgebench Traffic Signaling encrypted native ARM validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare ephemeral native runner
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography
          df -B1 .
      - name: Verify encrypted transport and unpack private fixtures
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_TRAFFIC_V1_R1_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/traffic-v1-static5-r1-20261013/traffic-v1-payload.aesgcm'
          echo '979c6d05f8ca11fc70a48513139d1796400515393ba90ca6d7da2fdf174274b2  payload.aesgcm' | sha256sum --check -
          python3 crypto_traffic_v1_r1.py decrypt payload.aesgcm decoded
          chmod 700 decoded
      - name: Actual native dual build and original Oracle NOP partial controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo -n python3 decoded/payload/scripts/run_arm_qc.py --package decoded/payload/package --fixtures decoded/payload/private-fixtures --output evidence/native --reference-repetitions 5 --execute > evidence/controller.log 2>&1
      - name: Encrypt all detailed validation evidence
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_TRAFFIC_V1_R1_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" python3 crypto_traffic_v1_r1.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-traffic-v1-native-arm-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
