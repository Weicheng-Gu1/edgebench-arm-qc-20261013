version: 2.1
jobs:
  vrptw-v1-native:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Spaceship v2 native source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_VRPTW_V1_CIRCLE_R1_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/vrptw-v1-r1/circle_worker.py --lane native --work /tmp/vrptw-v1-native-work --output /tmp/vrptw-v1-native-public
      - store_artifacts:
          path: /tmp/vrptw-v1-native-public
          destination: vrptw-v1-r1/native
  vrptw-v1-multi-agent:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Spaceship v2 multi-agent source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_VRPTW_V1_CIRCLE_R1_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/vrptw-v1-r1/circle_worker.py --lane multi-agent --work /tmp/vrptw-v1-multi-agent-work --output /tmp/vrptw-v1-multi-agent-public
      - store_artifacts:
          path: /tmp/vrptw-v1-multi-agent-public
          destination: vrptw-v1-r1/multi-agent
  vrptw-v1-multi-verifier:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Spaceship v2 multi-verifier source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_VRPTW_V1_CIRCLE_R1_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/vrptw-v1-r1/circle_worker.py --lane multi-verifier --work /tmp/vrptw-v1-multi-verifier-work --output /tmp/vrptw-v1-multi-verifier-public
      - store_artifacts:
          path: /tmp/vrptw-v1-multi-verifier-public
          destination: vrptw-v1-r1/multi-verifier
workflows:
  vrptw-v1-source-native-and-singlemulti:
    jobs:
      - vrptw-v1-native:
          filters:
            branches:
              only: edgebench-vrptw-v1-native-multi-circle-20261015-r1
      - vrptw-v1-multi-agent:
          filters:
            branches:
              only: edgebench-vrptw-v1-native-multi-circle-20261015-r1
      - vrptw-v1-multi-verifier:
          filters:
            branches:
              only: edgebench-vrptw-v1-native-multi-circle-20261015-r1
