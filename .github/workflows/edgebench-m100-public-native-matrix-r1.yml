name: M100 same-source public native AMD64 ARM64 build matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-public-build-and-static-controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install only SHA pinned public host wheels
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          /usr/bin/python3 --version
          curl --fail --location --retry 3 --output public-host-dependencies.zip 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-public-native-matrix-r1-20261015-static5-r1-20261014/public-host-dependencies.zip'
          echo '6c528f1986901036258a0d07004537c9c2c8bf7357c16ba0af3a3cb2c5a122a9  public-host-dependencies.zip' | sha256sum --check -
          mkdir -p public-host-dependencies
          unzip -q public-host-dependencies.zip -d public-host-dependencies
          /usr/bin/python3 -m pip install --no-index --find-links public-host-dependencies/common --find-links public-host-dependencies/${{ matrix.arch }} --require-hashes --target /tmp/m100-public-host-deps -r public-host-dependencies/requirements-${{ matrix.arch }}.txt
      - name: Authenticate encrypted fixed task and controls
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_PUBLIC_NATIVE_MATRIX_R1_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-public-native-matrix-r1-20261015-static5-r1-20261014/m100-public-native-matrix-r1-20261015-payload.aesgcm'
          echo '14a27346e440414a34cf0aa3c84961a41b53bedb632a74aa6160420ff5aced8a  payload.aesgcm' | sha256sum --check -
          PYTHONPATH=/tmp/m100-public-host-deps /usr/bin/python3 crypto_m100_public_native_matrix_r1.py decrypt payload.aesgcm decoded
          chmod 700 decoded
      - name: Authenticate and use exact shared source-only archive
        run: |
          set -euo pipefail
          echo 'ab43e8efdfff96e9d3aa3be24f9665f18de6e0e711e0ea9d5d6023f1caa9df95  decoded/payload/source-only-r2.tar.gz' | sha256sum --check -
          /usr/bin/python3 decoded/payload/scripts/verify_source_archive.py decoded/payload evidence/source-archive-identity.json
      - name: Build both roles and run original 23 static-plan controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo -n env DOCKER_BUILDKIT=0 PYTHONPATH=/tmp/m100-public-host-deps PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 decoded/payload/scripts/run_public_roles_qc.py --platform linux/${{ matrix.arch }} --package decoded/payload/package --fixtures decoded/payload/private-fixtures --output evidence/native --reference-repetitions 5 --execute > evidence/controller.log 2>&1
      - name: Encrypt detailed evidence including failures
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_PUBLIC_NATIVE_MATRIX_R1_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" PYTHONPATH=/tmp/m100-public-host-deps /usr/bin/python3 crypto_m100_public_native_matrix_r1.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted architecture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-m100-public-native-matrix-r1-${{ matrix.arch }}-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
