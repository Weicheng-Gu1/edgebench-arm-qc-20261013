name: Lux exact public roles single-invocation multi-platform builds r1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-multiplatform-role:
    strategy:
      fail-fast: false
      matrix:
        role: [agent, verifier]
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare only this ephemeral job build storage
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' /usr/bin/python3 -B lux_prepare_ephemeral_job_storage_r1.py evidence/ephemeral-job-storage.json
      - name: Fetch hash-pinned public crypto dependency
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output public-host-dependencies.zip 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-public-native-matrix-r1-20261015-static5-r1-20261014/public-host-dependencies.zip'
          echo '6c528f1986901036258a0d07004537c9c2c8bf7357c16ba0af3a3cb2c5a122a9  public-host-dependencies.zip' | sha256sum --check -
          mkdir -p public-host-dependencies
          unzip -q public-host-dependencies.zip -d public-host-dependencies
          /usr/bin/python3 -m pip install --no-index --find-links public-host-dependencies/common --find-links public-host-dependencies/amd64 --require-hashes --target /tmp/lux-single-multi-deps -r public-host-dependencies/requirements-amd64.txt
      - name: Authenticate reused encrypted immutable source
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_LUX_PUBLIC_NATIVE_MATRIX_R1_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/lux-public-native-matrix-r1-20261015/lux-public-native-matrix-r1-20261015-payload.aesgcm'
          echo '2a431333a70e8b5a6849cef25905bf9ef4cbc1414fc1f2bb48b5c025b4966c20  payload.aesgcm' | sha256sum --check -
          PYTHONPATH=/tmp/lux-single-multi-deps /usr/bin/python3 -B crypto_lux_public_native_matrix_r1.py decrypt payload.aesgcm decoded
          chmod 700 decoded
          echo '167fb02b96360978dfb433ceff3eb7c72d3843a71a304858e13eacfdfe9f835f  decoded/payload/source-public-runtime-r5.tar.gz' | sha256sum --check -
          /usr/bin/python3 -B decoded/payload/scripts/verify_payload.py decoded/payload evidence/source-archive-identity.json
      - name: Build one exact role once for both platforms and verify exported OCI
        run: |
          set -euo pipefail
          sudo -n env GITHUB_RUN_ID='${{ github.run_id }}' PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B lux_run_single_multiplatform_r1.py --role '${{ matrix.role }}' --payload decoded/payload --output evidence/build > evidence/controller.log 2>&1
      - name: Encrypt raw logs and small descriptor evidence including failures
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_LUX_PUBLIC_NATIVE_MATRIX_R1_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" PYTHONPATH=/tmp/lux-single-multi-deps /usr/bin/python3 -B crypto_lux_public_native_matrix_r1.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Upload only encrypted small proof and full logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgebench-lux-single-multiplatform-r1-${{ matrix.role }}-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
