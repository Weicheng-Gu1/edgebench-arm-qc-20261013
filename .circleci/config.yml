version: 2.1
jobs:
  native-quickjs-v005-task-qc:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Source-built frozen QuickJS task on native ARM64
          no_output_timeout: 45m
          command: timeout --signal=KILL 100m python3 .circleci/swe_quickjs_v005_native_arm_qc.py
      - store_artifacts:
          path: /tmp/swe-quickjs-v005-native-arm-public-r1
          destination: swe-QuickJS-native-arm-qc
workflows:
  swe-QuickJS-native-arm-qc-r1:
    jobs:
      - native-quickjs-v005-task-qc:
          filters:
            branches:
              only: swe-quickjs-v005-native-arm-qc-20261015-r1
