name: M100 current D exact two-role single-multiplatform source build lowercase owned-worker r2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-multiplatform-role:
    strategy:
      fail-fast: false
      matrix:
        role: [agent, verifier]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact public transport host closure
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output hostdeps.zip 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/esa-public-native-singlemulti-r1-20261015/esa-complete-controller-hostdeps-r1.zip'
          echo '1eda272936455c2f9689cf37a8378841f2177592daea759466df3b26e9c6dd2d  hostdeps.zip' | sha256sum --check -
          mkdir hostdeps
          unzip -q hostdeps.zip -d hostdeps
          /usr/bin/python3 -m pip install --no-index --find-links hostdeps/common --find-links hostdeps/amd64 --require-hashes --target /tmp/m100-current-D-singlemulti-hostdeps -r hostdeps/requirements-amd64.txt
          PYTHONPATH=/tmp/m100-current-D-singlemulti-hostdeps /usr/bin/python3 -S -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print("transport_import_ok")'
      - name: Decrypt exact source context only
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_CURRENT_D_SINGLEMULTI_R2_TRANSPORT_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output payload.aesgcm 'https://github.com/Weicheng-Gu1/edgebench-arm-qc-20261013/releases/download/m100-current-d-singlemulti-r2-20261015/m100-current-d-singlemulti-r2-20261015-payload.aesgcm'
          echo '9802fde1407ba4d3703c6dc6489e98195db4874fe75a53ff0660e91338561561  payload.aesgcm' | sha256sum --check -
          PYTHONPATH=/tmp/m100-current-D-singlemulti-hostdeps /usr/bin/python3 -S crypto_m100_current_d_singlemulti_r2.py decrypt payload.aesgcm decoded
          chmod 700 decoded
          echo 'f2236835434e4c8fcdbb7361e2f1d3f59867069b5b3afe8f5f642bd1ab2b6bf9  decoded/payload/M100-CONTEXT-SOURCE-MANIFEST.json' | sha256sum --check -
          echo 'ac71127d22ddbbbf8351c1c47d0ee74bb0f7b26110e07a5f2d568bb338a06752  decoded/payload/scripts/run_single_multiplatform.py' | sha256sum --check -
      - name: One actual build invocation per role both architectures streamed OCI
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir evidence
          sudo -n env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B decoded/payload/scripts/run_single_multiplatform.py --role '${{ matrix.role }}' --payload decoded/payload --output evidence/multi > evidence/controller.log 2>&1
      - name: Encrypt raw evidence including failures
        if: always()
        env:
          EDGEBENCH_TRANSPORT_KEY: ${{ secrets.EDGEBENCH_M100_CURRENT_D_SINGLEMULTI_R2_TRANSPORT_KEY }}
        run: |
          mkdir -p evidence
          sudo -n env EDGEBENCH_TRANSPORT_KEY="$EDGEBENCH_TRANSPORT_KEY" PYTHONPATH=/tmp/m100-current-D-singlemulti-hostdeps /usr/bin/python3 -S crypto_m100_current_d_singlemulti_r2.py encrypt evidence evidence.aesgcm
          sudo chown "$(id -u):$(id -g)" evidence.aesgcm
      - name: Retain encrypted raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m100-current-d-singlemulti-r2-${{ matrix.role }}-encrypted
          path: evidence.aesgcm
          if-no-files-found: error
          retention-days: 7
