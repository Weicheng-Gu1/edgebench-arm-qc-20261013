name: One sealed native ARM fixed control
'on':
  workflow_dispatch:
    inputs:
      run_sealed_formal:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: sealed-dirichlet-own-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-sealed-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sealed_formal }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    environment: edgebench-dirichlet-arm-once-20261015t202404z-7f243a34
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare explicit system Python cryptography
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
          /usr/bin/python3 -c 'import cryptography; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; from cryptography.hazmat.primitives.asymmetric import padding; print("explicit-system-crypto-ok", cryptography.__version__)'
      - name: Start one sealed control and confirm original payload loaded
        timeout-minutes: 3
        env:
          EB_PAYLOAD_KEY_B64: ${{ secrets.EB_PAYLOAD_KEY_B64 }}
          EB_APPROVED_REVISION: ${{ secrets.EB_APPROVED_REVISION }}
          EB_ONE_USE_NONCE: ${{ secrets.EB_ONE_USE_NONCE }}
        run: /usr/bin/python3 -u ci/run_sealed_control.py
      - name: Observe original control window 01
        if: ${{ always() }}
        id: window01
        timeout-minutes: 32
        run: /usr/bin/python3 -u ci/watch_existing_control_bounded.py --max-seconds 1800
      - name: Upload authenticated ciphertext checkpoint 01
        if: ${{ always() && steps.window01.outputs.upload == 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-original-checkpoint-01-${{ github.run_id }}
          path: sealed-artifacts/*.enc
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - name: Observe original control window 02
        if: ${{ always() }}
        id: window02
        timeout-minutes: 32
        run: /usr/bin/python3 -u ci/watch_existing_control_bounded.py --max-seconds 1800
      - name: Upload authenticated ciphertext checkpoint 02
        if: ${{ always() && steps.window02.outputs.upload == 'true' }}
