version: 2.1
jobs:
  dmc-current904-native-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Exact current task native ARM Docker controls
          no_output_timeout: 60m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            sudo mkdir -p /ci
            sudo chown "$USER:$USER" /ci
            timeout 3500 python3 ci/bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: game-dmc-current904-native-arm
workflows:
  dmc-current904-native-arm:
    jobs:
      - dmc-current904-native-arm
