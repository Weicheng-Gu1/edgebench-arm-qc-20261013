version: 2.1
jobs:
  traffic-native-arm-20261017-r1:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Frozen Traffic source native ARM two-role dual-entry controls
          no_output_timeout: 130m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            timeout 7500 python3 ci/traffic-arm-outer-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: traffic-native-arm-20261017-r1
workflows:
  traffic-native-arm-20261017-r1:
    jobs:
      - traffic-native-arm-20261017-r1
