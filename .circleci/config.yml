version: 2.1
jobs:
  nanobot-formal-native-arm-score-v2-c1:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Exact formal source ARM C++ checker and static NBT dual-entry controls
          no_output_timeout: 125m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            timeout 7400 python3 ci/nanobot-arm-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: nanobot-formal-native-arm-score-v2-c1
workflows:
  nanobot-formal-native-arm-score-v2-c1:
    jobs:
      - nanobot-formal-native-arm-score-v2-c1
