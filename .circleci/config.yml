version: 2.1
jobs:
  jagua-packing-native-arm-c1:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Pinned source native ARM rebuild and six controls
          no_output_timeout: 60m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            timeout 3500 python3 ci/jagua-arm-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: jagua-packing-native-arm-c1
workflows:
  jagua-packing-native-arm-c1:
    jobs:
      - jagua-packing-native-arm-c1

