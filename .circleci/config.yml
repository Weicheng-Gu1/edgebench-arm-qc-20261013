version: 2.1
jobs:
  luxs3-original-v11-native-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Native ARM source builds and original full-game controls
          no_output_timeout: 120m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            sudo mkdir -p /ci
            sudo chown "$USER:$USER" /ci
            sudo --preserve-env=LUXS3_V10_NATIVE_ARM_QC_20261017_V1,CIRCLE_BUILD_NUM /usr/bin/timeout 10800 /usr/bin/python3 ci/bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: game-luxs3-original-v11-native-arm
workflows:
  luxs3-original-v11-native-arm:
    jobs:
      - luxs3-original-v11-native-arm
