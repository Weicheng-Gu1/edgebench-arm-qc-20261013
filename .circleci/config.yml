version: 2.1
jobs:
  tricol-formal-native-arm-c1:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Exact formal source ARM dual-entry and C++ isolation controls
          no_output_timeout: 95m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            timeout 5600 python3 ci/tricol-arm-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: tricol-formal-native-arm-c1
workflows:
  tricol-formal-native-arm-c1:
    jobs:
      - tricol-formal-native-arm-c1
