version: 2.1
jobs:
  ahc051-fixed143-native-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Exact143 native ARM Docker/static-layout controls
          no_output_timeout: 40m
          command: |
            set +x
            test "$(uname -m)" = aarch64
            sudo mkdir -p /ci
            sudo chown "$USER:$USER" /ci
            timeout 2400 python3 ci/ahc051-bootstrap.py
      - store_artifacts:
          path: circle-artifact
          destination: game-ahc051-fixed143-native-arm
workflows:
  ahc051-fixed143-native-arm:
    jobs:
      - ahc051-fixed143-native-arm
