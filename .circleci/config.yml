version: 2.1
jobs:
  spaceship-v2-multi-agent:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Spaceship v2 multi-agent original failed before build routing repair
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_SPACESHIP_V2_CIRCLE_R3_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/spaceship-v2-r3/circle_worker.py --lane multi-agent --work /tmp/spaceship-v2-r3-multi-agent-work --output /tmp/spaceship-v2-r3-multi-agent-public
      - store_artifacts:
          path: /tmp/spaceship-v2-r3-multi-agent-public
          destination: spaceship-v2-r3/multi-agent
  spaceship-v2-multi-verifier:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Spaceship v2 multi-verifier original failed before build routing repair
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_SPACESHIP_V2_CIRCLE_R3_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/spaceship-v2-r3/circle_worker.py --lane multi-verifier --work /tmp/spaceship-v2-r3-multi-verifier-work --output /tmp/spaceship-v2-r3-multi-verifier-public
      - store_artifacts:
          path: /tmp/spaceship-v2-r3-multi-verifier-public
          destination: spaceship-v2-r3/multi-verifier
workflows:
  spaceship-v2-singlemulti-host-routing-repair:
    jobs:
      - spaceship-v2-multi-agent:
          filters:
            branches:
              only: edgebench-spaceship-v2-multi-host-routing-circle-20261015-r3
      - spaceship-v2-multi-verifier:
          filters:
            branches:
              only: edgebench-spaceship-v2-multi-host-routing-circle-20261015-r3
