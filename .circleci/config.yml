version: 2.1
jobs:
  esa-bounded-physics-multi-agent:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: ESA bounded physics missing-only multi-agent source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_ESA_BOUNDED_PHYSICS_CIRCLE_R2_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/esa-bounded-physics-r2/circle_worker.py --lane multi-agent --work /tmp/esa-bounded-physics-multi-agent-work --output /tmp/esa-bounded-physics-multi-agent-public
      - store_artifacts:
          path: /tmp/esa-bounded-physics-multi-agent-public
          destination: esa-bounded-physics-r2/multi-agent
  esa-bounded-physics-multi-verifier:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: ESA bounded physics missing-only multi-verifier source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_ESA_BOUNDED_PHYSICS_CIRCLE_R2_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/esa-bounded-physics-r2/circle_worker.py --lane multi-verifier --work /tmp/esa-bounded-physics-multi-verifier-work --output /tmp/esa-bounded-physics-multi-verifier-public
      - store_artifacts:
          path: /tmp/esa-bounded-physics-multi-verifier-public
          destination: esa-bounded-physics-r2/multi-verifier
workflows:
  esa-bounded-physics-source-native-and-singlemulti:
    jobs:
      - esa-bounded-physics-multi-agent:
          filters:
            branches:
              only: edgebench-esa-bounded-physics-source-only-multi-20261015-r2
      - esa-bounded-physics-multi-verifier:
          filters:
            branches:
              only: edgebench-esa-bounded-physics-source-only-multi-20261015-r2
