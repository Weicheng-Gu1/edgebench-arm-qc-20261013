version: 2.1
jobs:
  native-cad-v003-task-qc:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: Source-built frozen CAD task on native ARM64
          no_output_timeout: 45m
          command: timeout --signal=KILL 100m python3 .circleci/swe_cad_v003_native_arm_qc.py
      - store_artifacts:
          path: /tmp/swe-cad-v003-native-arm-public-r1
          destination: swe-CAD-native-arm-qc
workflows:
  swe-CAD-native-arm-qc-r1:
    jobs:
      - native-cad-v003-task-qc:
          filters:
            branches:
              only: swe-cad-v003-native-arm-diagnostics-20261016-r3
