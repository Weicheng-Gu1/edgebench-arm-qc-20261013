version: 2.1
jobs:
  kahip-v1-native:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.large
    steps:
      - checkout
      - run:
          name: KaHIP missing-only native source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_KAHIP_V1_CIRCLE_R2_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/kahip-v1-r2/circle_worker.py --lane native --work /tmp/kahip-v1-native-work --output /tmp/kahip-v1-native-public
      - store_artifacts:
          path: /tmp/kahip-v1-native-public
          destination: kahip-v1-r2/native
  kahip-v1-multi-agent:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: KaHIP missing-only multi-agent source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_KAHIP_V1_CIRCLE_R2_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/kahip-v1-r2/circle_worker.py --lane multi-agent --work /tmp/kahip-v1-multi-agent-work --output /tmp/kahip-v1-multi-agent-public
      - store_artifacts:
          path: /tmp/kahip-v1-multi-agent-public
          destination: kahip-v1-r2/multi-agent
  kahip-v1-multi-verifier:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: KaHIP missing-only multi-verifier source-only independent control
          no_output_timeout: 245m
          command: sudo --preserve-env=EDGEBENCH_KAHIP_V1_CIRCLE_R2_KEY,CIRCLE_SHA1,CIRCLE_BUILD_NUM -n python3 .circleci/kahip-v1-r2/circle_worker.py --lane multi-verifier --work /tmp/kahip-v1-multi-verifier-work --output /tmp/kahip-v1-multi-verifier-public
      - store_artifacts:
          path: /tmp/kahip-v1-multi-verifier-public
          destination: kahip-v1-r2/multi-verifier
workflows:
  kahip-v1-source-native-and-singlemulti:
    jobs:
      - kahip-v1-native:
          filters:
            branches:
              only: edgebench-kahip-v1-native-multi-20261015-r2
      - kahip-v1-multi-agent:
          filters:
            branches:
              only: edgebench-kahip-v1-native-multi-20261015-r2
      - kahip-v1-multi-verifier:
          filters:
            branches:
              only: edgebench-kahip-v1-native-multi-20261015-r2
